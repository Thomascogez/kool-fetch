name: Release

on:
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write 
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v4

        - name: "Install pnpm"
          uses: pnpm/action-setup@v4

        - name: "Install Node.js"
          uses: actions/setup-node@v4
          with:
            node-version: '24'
            cache: 'pnpm'
            registry-url: 'https://registry.npmjs.org'

        - name: "Install dependencies"
          run: pnpm install --frozen-lockfile

        - name: Checks
          run: pnpm run checks

        - name: Test
          run: pnpm run test:single

        - name: Build
          run: pnpm run build

        # npm publish (rather than pnpm publish) for npm's OIDC trusted publishing support.
        - run: npm publish